name: qrisp-cudaq unit tests via Pytest

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    # Nightly run against Qrisp main, so that Qrisp changes that break
    # qrisp-cudaq show up before the next Qrisp release.
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test Py${{ matrix.python-version }} (Qrisp ${{ matrix.qrisp }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        qrisp: ["release", "main"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Qrisp main
        if: matrix.qrisp == 'main'
        run: |
          python -m pip install --upgrade pip
          pip install "qrisp[xdsl] @ git+https://github.com/eclipse-qrisp/Qrisp@main"

      - name: Install qrisp-cudaq
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Show the Qrisp under test
        env:
          EXPECTED: ${{ matrix.qrisp }}
        run: |
          python - <<'EOF'
          import importlib.metadata as md
          import os
          import sys

          dist = md.distribution("qrisp")
          origin = dist.read_text("direct_url.json") or "PyPI"
          print("qrisp", dist.version, origin)
          if os.environ["EXPECTED"] == "main" and "eclipse-qrisp/Qrisp" not in origin:
              sys.exit("Qrisp main was replaced by another Qrisp during installation")
          EOF

      - name: Test with pytest
        run: pytest tests
